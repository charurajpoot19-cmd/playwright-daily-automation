name: Daily Playwright Automation

on:
  workflow_dispatch:

  schedule:
    - cron: '30 3 * * *'

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install Dependencies
        run: npm ci

      - name: Install Playwright Browser
        run: npx playwright install --with-deps chromium

      - name: Run Playwright Tests
        run: npx playwright test

      - name: Generate and Upload HTML Report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-html-report
          path: reports/html-report/
          retention-days: 30

      # Builds reports/email-report.html, the PDF report and the subject line from the JSON report
      - name: Build Email Report
        id: email_report
        if: always()
        run: node scripts/email-report.js

      - name: Upload PDF Report
        if: always() && steps.email_report.outcome == 'success'
        uses: actions/upload-artifact@v4
        with:
          name: oncquest-test-report-pdf
          path: reports/Oncquest_Test_Execution_Report.pdf
          retention-days: 30

      # Needs repo secrets: FROM_MAIL, PASSWORD (Gmail app password), MAIL_TO
      - name: Send Report Email
        if: always() && steps.email_report.outcome == 'success'
        uses: dawidd6/action-send-mail@v3
        with:
          server_address: smtp.gmail.com
          server_port: 465
          secure: true
          username: ${{ secrets.FROM_MAIL }}
          password: ${{ secrets.PASSWORD }}
          from: Oncquest Automation <${{ secrets.FROM_MAIL }}>
          to: ${{ secrets.MAIL_TO }}
          subject: ${{ steps.email_report.outputs.subject }}
          html_body: file://reports/email-report.html
          attachments: reports/Oncquest_Test_Execution_Report.pdf
